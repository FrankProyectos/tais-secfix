rules:
  - id: flask-sqli-tainted-query
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Datos de la petición HTTP llegan a la cadena SQL de execute() sin
      parametrizar. Un atacante puede alterar la consulta (inyección SQL).
      Usa marcadores (?) y pasa los valores como parámetros.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      secfix_cwe: CWE-89
      owasp: "A03:2021 - Injection"
    pattern-sources:
      - pattern: flask.request.$ATTR
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.executemany($Q, ...)
              - pattern: $CUR.executescript($Q)
          - focus-metavariable: $Q
